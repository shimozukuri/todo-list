  title: Golang ToDo API
  version: "1.0"
paths:
  /statistics:
    get:
      description: Get statistics with optional filtering by author user ID and date
        range
      parameters:
      - description: Filter by author user ID
        in: query
        name: user_id
        type: integer
      - description: 'Start date for statistics calculation (inclusive), format: YYYY-MM-DD'
        in: query
        name: from
        type: string
      - description: 'End date for statistics calculation (exclusive), format: YYYY-MM-DD'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success to get statistics
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
      summary: Get statistics
      tags:
      - statistics
  /tasks:
    get:
      description: Get all tasks with optional pagination or filtration by author
        user ID
      parameters:
      - description: Filtration by author user ID of tasks
        in: query
        name: user_id
        type: integer
      - description: Size of page with tasks
        in: query
        name: limit
        type: integer
      - description: Shift of page with tasks
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success to get list of tasks
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TasksDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
      summary: Get Tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Create new task
      parameters:
      - description: CreateTask request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success to create new task
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Author not found
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
      summary: Create Task
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Delete task by ID
      parameters:
      - description: task ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Success to delete task
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
      summary: Delete Task
      tags:
      - tasks
    get:
      description: Get task by ID
      parameters:
      - description: task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success to get task
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
      summary: Get Task
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: |-
        Update task by ID
        ### Field update behavior (three-state logic):
        1. **Field omitted**: `description` is ignored; the existing database value remains unchanged.
        2. **Value provided**: `"description": "2 liters"` updates the database value.
        3. **Explicit null**: `"description": null` sets the database value to `NULL`.
        **Restriction**: `title` and `completed` can't be `null`.
      parameters:
      - description: task ID
        in: path
        name: id
        required: true
        type: integer
      - description: PatchTask request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success to update task
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_shimozukuri_todo-list_internal_core_transport_http_response.ErrorResponse'
      summary: Update Task
      tags:
      - tasks
